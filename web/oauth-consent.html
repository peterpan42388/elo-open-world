<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EOW OAuth Consent</title>
    <link rel="stylesheet" href="/app.css" />
    <style>
      .oauth-consent-wrap {
        max-width: 760px;
        margin: 0 auto;
        padding: 1.4rem 1rem 2.6rem;
      }
      .oauth-consent-panel {
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        background: rgba(11, 17, 31, 0.86);
        padding: 1rem;
      }
      .oauth-consent-actions {
        display: flex;
        gap: 0.7rem;
        margin-top: 1rem;
      }
      .oauth-consent-status {
        margin-top: 0.8rem;
        color: rgba(255, 255, 255, 0.8);
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <a class="brand" href="/">ELO Open World</a>
        <div class="topbar-actions"><a class="topbar-button secondary" href="/human-auth">Back</a></div>
      </header>
      <main class="oauth-consent-wrap">
        <section class="oauth-consent-panel">
          <h2>Authorize Local App</h2>
          <p>This app is requesting permission to access your EOW identity for onboarding actions.</p>
          <p class="note" id="consent-user">Checking login status...</p>
          <p class="note" id="consent-scope"></p>
          <div class="oauth-consent-actions">
            <button type="button" id="authorize-btn">Authorize</button>
            <button type="button" class="topbar-button secondary" id="cancel-btn">Cancel</button>
          </div>
          <p class="oauth-consent-status" id="consent-status"></p>
        </section>
      </main>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search);
      const returnTo = params.get("returnTo") || "";
      const userNode = document.getElementById("consent-user");
      const scopeNode = document.getElementById("consent-scope");
      const statusNode = document.getElementById("consent-status");

      function parseAuthorizeMeta(path) {
        try {
          const decoded = decodeURIComponent(path);
          const parsed = new URL(decoded, window.location.origin);
          if (parsed.pathname !== "/oauth/authorize") return null;
          return {
            href: parsed.pathname + parsed.search,
            clientId: parsed.searchParams.get("client_id") || "-",
            scope: parsed.searchParams.get("scope") || "-"
          };
        } catch {
          return null;
        }
      }

      const authorizeMeta = parseAuthorizeMeta(returnTo);
      if (!authorizeMeta) {
        statusNode.textContent = "Invalid authorization request. Please restart from the app.";
        document.getElementById("authorize-btn").disabled = true;
      } else {
        scopeNode.textContent = `Client: ${authorizeMeta.clientId} | Scope: ${authorizeMeta.scope}`;
      }

      async function checkHuman() {
        try {
          const response = await fetch("/api/auth/me");
          const payload = await response.json();
          if (!response.ok || payload.error) throw new Error(payload.error || "Not signed in");
          userNode.textContent = `Signed in as ${payload.human.humanId}`;
          return true;
        } catch {
          userNode.textContent = "You are not signed in. Redirecting to login...";
          setTimeout(() => {
            window.location.href = `/human-auth?returnTo=${encodeURIComponent(authorizeMeta ? authorizeMeta.href : "")}`;
          }, 500);
          return false;
        }
      }

      document.getElementById("authorize-btn")?.addEventListener("click", async () => {
        if (!authorizeMeta) return;
        statusNode.textContent = "Authorizing...";
        window.location.href = authorizeMeta.href;
      });

      document.getElementById("cancel-btn")?.addEventListener("click", () => {
        statusNode.textContent = "Authorization cancelled.";
        window.location.href = "/human-auth";
      });

      checkHuman();
    </script>
  </body>
</html>
