services:
  elo-open-world:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.runtime
    container_name: elo-open-world
    restart: unless-stopped
    environment:
      PORT: 8788
    ports:
      - "127.0.0.1:18788:8788"
    volumes:
      - ../runtime:/app/runtime
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8788/api/world/summary >/dev/null || exit 1"]
      interval: 20s
      timeout: 3s
      retries: 5
      start_period: 10s
